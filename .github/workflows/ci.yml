name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r plugins/codex-usage-panel/requirements.txt
      - name: Run backend and offscreen window tests
        run: python -m unittest discover -s plugins/codex-usage-panel -p 'test_*.py'
      - name: Validate metadata and build release packages
        run: python scripts/package_release.py
      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
